# ============================================================================
# ofox-mi8953-12.1 - Build OrangeFox Recovery (fox_12.1) for Xiaomi Mi8953
# ----------------------------------------------------------------------------
# PRINCIPLE: this workflow builds FROM THIS REPO.
#   - The device tree is taken via actions/checkout (this repo itself),
#     then placed into device/xiaomi/Mi8953 inside the OrangeFox source.
#     There is NO step that clones a device tree from another repo.
#   - The only cloning that happens is for the OrangeFox build SOURCE
#     (manifest + bootable/recovery + vendor/recovery) using the official
#     gitlab.com/OrangeFox/sync script - this is required, because a device
#     tree alone cannot be built without the recovery source.
#   - Reference: ofox-vince-12.1-1.yml (reference only, the main target
#     is still Mi8953 - unified: mido / vince / ysl).
#
# TELEGRAM NOTIFICATIONS -> ONLY ONE MESSAGE, REALTIME:
#   - The first step ("Set up job") creates /tmp/tgnotify.sh and SENDS
#     ONE Telegram message (header + list of all jobs) to the chat.
#   - Each job is wrapped in 3 steps:
#       "Notify <job>"            -> 🔄 line appears + timer starts
#       <job>                     -> the actual work
#       "Notify <job> (done)"     -> ✅ duration (seconds/minutes/hours)
#                                    ❌ duration + build log uploaded to Telegram
#   - The SAME message is edited continuously by a background ticker
#     (3 seconds), and the compile step edits it every 1 second ->
#     the RUNNING duration is shown in REALTIME.
#   - Success/Failure is closed with a verdict line (✅ BUILD SUCCESS /
#     ❌ BUILD FAILED) in the same message.
#   - The old "sendMessage" steps (Build Started / Syncing / Compiling /
#     Success / Failed) are gone -> everything is now a line in that one
#     message.
#   - The disk monitor, which used to send a separate message, now only
#     adds a ⚠️ line to the same message.
# ============================================================================

name: ofox-mi8953-12.1-realtime

on:
  workflow_dispatch:
    inputs:
      maintainer:
        description: "Maintainer name (OF_MAINTAINER) shown in the recovery"
        required: false
        default: "Rahmat Sobrian"
      target:
        description: "Make target"
        required: false
        default: "recoveryimage"
      use_latest_magisk:
        description: "Bundle the latest Magisk into the installer zip"
        type: boolean
        required: false
        default: true

defaults:
  run:
    shell: bash

env:
  # ==== OrangeFox source sync (official OrangeFox/sync script) ====
  FOX_SYNC_REPO: "https://gitlab.com/OrangeFox/sync.git"
  FOX_BRANCH: "fox_12.1"                       # -> sync script: --branch 12.1
  SYNC_PATH: "${{ github.workspace }}/fox_12.1"

  # ==== Device tree = THIS REPO (actions/checkout result, not a clone) ====
  DT_PATH: "${{ github.workspace }}/device_tree"
  DT_DEST: "device/xiaomi/Mi8953"

  # ==== Target build: Mi8953 (unified: mido / vince / ysl) ====
  DEVICE: "Mi8953"
  LUNCH_TARGET: "ofox_Mi8953-eng"
  EXPECTED_PRODUCT: "ofox_Mi8953"
  OF_BUILD_TYPE: "Unofficial-CI"

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      # =====================================================================
      # SET UP JOB: create the /tmp/tgnotify.sh helper + SEND ONE TELEGRAM MESSAGE.
      # All later notifications only edit that same message.
      # =====================================================================
      - name: Set up job
        id: setup
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          cat > /tmp/tgnotify.sh <<'TGEOF'
          #!/usr/bin/env bash
          # tgnotify.sh - ALL workflow notifications go through ONE Telegram
          # message that is edited in realtime until the job finishes.
          STATE=/tmp/tg_state.tsv
          MSGID=/tmp/tg_msg_id
          LOCK=/tmp/tg_notify.lock
          PHASE=/tmp/tg_phase.txt
          META=/tmp/tg_meta.env
          VERDICT=/tmp/tg_verdict.txt
          WARN=/tmp/tg_warn.txt
          LOGFLAG=/tmp/tg_log_uploaded
          TICKPID=/tmp/tg_ticker.pid

          if [ -f "$META" ]; then
            . "$META" 2>/dev/null || true
          fi

          enabled() { [ -n "${TG_BOT_TOKEN:-}" ] && [ -n "${TG_CHAT_ID:-}" ]; }

          hms() {
            local s="${1:-0}" h m r
            case "$s" in ''|*[!0-9]*) s=0 ;; esac
            h=$((s / 3600))
            m=$(((s % 3600) / 60))
            r=$((s % 60))
            if [ "$h" -gt 0 ]; then
              printf '%dh %dm %ds' "$h" "$m" "$r"
            elif [ "$m" -gt 0 ]; then
              printf '%dm %ds' "$m" "$r"
            else
              printf '%ds' "$r"
            fi
          }

          lock() { exec 9>"$LOCK"; flock -w 20 9 || true; }
          unlock() { exec 9>&- 2>/dev/null || true; }

          build_text() {
            local now out label st status en dur
            now=$(date +%s)
            out="🦊 OrangeFox Build - Mi8953 (${FOX_BRANCH:-fox_12.1})"
            out="$out
          📱 Device: Xiaomi Mi8953 unified (mido/vince/ysl)
          🎯 Lunch: ${LUNCH_TARGET:-ofox_Mi8953-eng}
          🕒 Started: ${TG_START_TIME:-n/a}
          📌 Status: $( [ -f "$PHASE" ] && cat "$PHASE" || printf 'running...' )"
            if [ -f "$WARN" ]; then
              while IFS= read -r w; do
                [ -n "$w" ] || continue
                out="$out
          ⚠️ $w"
              done <"$WARN"
            fi
            out="$out
          ──────────────────"
            if [ -f "$STATE" ]; then
              while IFS='|' read -r label st status en; do
                [ -n "${label:-}" ] || continue
                case "${status:-run}" in
                  ok)
                    dur=$((${en:-$now} - ${st:-$now}))
                    out="$out
          ✅ ${label} - $(hms "$dur")" ;;
                  fail)
                    dur=$((${en:-$now} - ${st:-$now}))
                    out="$out
          ❌ ${label} - $(hms "$dur")" ;;
                  *)
                    dur=$((now - ${st:-$now}))
                    out="$out
          🔄 ${label} - $(hms "$dur")" ;;
                esac
              done <"$STATE"
            fi
            if [ -f "$VERDICT" ]; then
              out="$out
          ──────────────────
          $(cat "$VERDICT")"
            fi
            printf '%s' "$out"
          }

          send() {
            enabled || return 0
            local text="$1" mid code i resp ra
            mid=$(cat "$MSGID" 2>/dev/null || true)
            if [ -z "$mid" ]; then
              resp=$(curl -s -m 30 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendMessage" \
                       --data-urlencode "chat_id=${TG_CHAT_ID}" \
                       --data-urlencode "text=${text}" 2>/dev/null || true)
              mid=$(printf '%s' "$resp" | grep -o '"message_id":[0-9]*' | head -1 | cut -d: -f2 || true)
              if [ -n "$mid" ]; then
                printf '%s' "$mid" >"$MSGID"
                printf 'tgnotify: Telegram message created (message_id=%s)\n' "$mid"
                return 0
              fi
              printf 'tgnotify: sendMessage failed: %s\n' "$resp"
              return 0
            fi
            i=0
            while [ "$i" -lt 4 ]; do
              code=$(curl -s -m 30 -o /tmp/tg_last_resp.json -w '%{http_code}' -X POST \
                       "https://api.telegram.org/bot${TG_BOT_TOKEN}/editMessageText" \
                       --data-urlencode "chat_id=${TG_CHAT_ID}" \
                       --data-urlencode "message_id=${mid}" \
                       --data-urlencode "text=${text}" 2>/dev/null || true)
              [ -n "$code" ] || code=000
              if [ "$code" = "200" ]; then
                return 0
              fi
              if [ "$code" = "429" ]; then
                ra=$(grep -o '"retry_after":[0-9]*' /tmp/tg_last_resp.json 2>/dev/null | head -1 | cut -d: -f2 || true)
                [ -n "$ra" ] || ra=2
                sleep "$ra"
              else
                if grep -q 'message is not modified' /tmp/tg_last_resp.json 2>/dev/null; then
                  return 0
                fi
                sleep 1
              fi
              i=$((i + 1))
            done
            return 0
          }

          refresh() { enabled || return 0; send "$(build_text)"; }

          ensure_ticker() {
            local pid
            pid=$(cat "$TICKPID" 2>/dev/null || true)
            if [ -n "$pid" ] && kill -0 "$pid" 2>/dev/null \
               && grep -qa tgnotify.sh "/proc/$pid/cmdline" 2>/dev/null; then
              return 0
            fi
            nohup bash "$0" ticker >>/tmp/tg_ticker.log 2>&1 &
            printf '%s' "$!" >"$TICKPID"
            return 0
          }

          cmd_begin() {
            local label="${1:-}"
            [ -n "$label" ] || return 0
            enabled || return 0
            ensure_ticker
            lock
            [ -f "$STATE" ] || : >"$STATE"
            printf '%s|%s|run|0\n' "$label" "$(date +%s)" >>"$STATE"
            refresh
            unlock
            return 0
          }

          cmd_end() {
            local label="${1:-}" outcome="${2:-success}" now tmp
            [ -n "$label" ] || return 0
            enabled || return 0
            now=$(date +%s)
            lock
            if [ -f "$STATE" ]; then
              tmp=$(mktemp)
              if awk -F'|' -v l="$label" -v n="$now" -v o="$outcome" '
                  {
                    if ($1 == l && !done) {
                      if (o == "success") { $3 = "ok" } else { $3 = "fail" }
                      $4 = n
                      done = 1
                    }
                    printf "%s|%s|%s|%s\n", $1, $2, $3, $4
                  }' "$STATE" >"$tmp"; then
                mv "$tmp" "$STATE"
              else
                rm -f "$tmp"
              fi
            fi
            refresh
            unlock
            if [ "$outcome" != "success" ]; then
              cmd_uploadlog "$label"
            fi
            return 0
          }

          cmd_phase() {
            local p="${1:-}"
            enabled || return 0
            [ -n "$p" ] || return 0
            printf '%s' "$p" >"$PHASE"
            lock
            refresh
            unlock
          }

          cmd_warn() {
            local w="${1:-}"
            enabled || return 0
            [ -n "$w" ] || return 0
            touch "$WARN" 2>/dev/null || true
            if ! grep -qxF "$w" "$WARN" 2>/dev/null; then
              printf '%s\n' "$w" >>"$WARN"
            fi
            lock
            refresh
            unlock
          }

          cmd_tick() {
            enabled || return 0
            lock
            refresh
            unlock
          }

          cmd_uploadlog() {
            local why="${1:-build}" f="" c size cap
            enabled || return 0
            if [ -f "$LOGFLAG" ]; then
              return 0
            fi
            for c in "${SYNC_PATH:-}/logs/build.txt" "/tmp/full_build.log" "/tmp/disk_monitor.log"; do
              if [ -n "$c" ] && [ -s "$c" ]; then
                f="$c"
                break
              fi
            done
            if [ -z "$f" ]; then
              printf 'tgnotify: no log available to upload yet (%s)\n' "$why"
              return 0
            fi
            size=$(du -m "$f" 2>/dev/null | cut -f1 || true)
            case "$size" in ''|*[!0-9]*) size=0 ;; esac
            cap="📄 OrangeFox Mi8953 build log - failed at: ${why}"
            if [ "$size" -gt 45 ]; then
              if gzip -kf "$f"; then
                f="${f}.gz"
                cap="📄 OrangeFox Mi8953 build log (compressed) - failed at: ${why}"
              fi
            fi
            curl -s -m 180 -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F "chat_id=${TG_CHAT_ID}" \
              -F "document=@${f}" \
              -F "caption=${cap}" >/dev/null 2>&1 || true
            : >"$LOGFLAG"
            printf 'tgnotify: log sent to Telegram: %s\n' "$f"
            return 0
          }

          cmd_verdict() {
            local k="${1:-}" e1="${2:-}" e2="${3:-}" st dur
            enabled || return 0
            st="${TG_START_EPOCH:-0}"
            case "$st" in ''|*[!0-9]*) st=0 ;; esac
            dur=$(($(date +%s) - st))
            [ "$dur" -ge 0 ] 2>/dev/null || dur=0
            case "$k" in
              success)
                printf '✅ BUILD SUCCESS - total %s' \
                  "$(hms "$dur")" "${e1:-N/A}" "${e2:-N/A}" >"$VERDICT"
                ;;
              failure)
                printf '❌ BUILD FAILED - total %s\n💾 Disk: %s\n📄 Build log was sent to Telegram / is available in artifacts' \
                  "$(hms "$dur")" "${e2:-N/A}" >"$VERDICT"
                ;;
              cancelled)
                printf '⏹️ BUILD CANCELLED - total %s' "$(hms "$dur")" >"$VERDICT"
                ;;
              *)
                return 0
                ;;
            esac
            lock
            refresh
            unlock
          }

          cmd_finalize() {
            local k="${1:-}" now tmp
            enabled || return 0
            if [ -f "$TICKPID" ]; then
              kill "$(cat "$TICKPID" 2>/dev/null)" 2>/dev/null || true
              rm -f "$TICKPID"
            fi
            now=$(date +%s)
            lock
            if [ -f "$STATE" ]; then
              tmp=$(mktemp)
              if awk -F'|' -v n="$now" '
                  {
                    if ($3 == "run") { $3 = "fail"; $4 = n }
                    printf "%s|%s|%s|%s\n", $1, $2, $3, $4
                  }' "$STATE" >"$tmp"; then
                mv "$tmp" "$STATE"
              else
                rm -f "$tmp"
              fi
            fi
            unlock
            case "$k" in success|failure|cancelled) ;; *) k="" ;; esac
            if [ -z "$k" ]; then
              if [ -f "$STATE" ] && grep -q '|fail|' "$STATE" 2>/dev/null; then
                k="failure"
              else
                k="success"
              fi
            fi
            if [ ! -f "$VERDICT" ]; then
              cmd_verdict "$k"
            else
              lock
              refresh
              unlock
            fi
            return 0
          }

          cmd_ticker() {
            printf '%s' "$$" >"$TICKPID"
            while true; do
              sleep 3
              if [ -f "$STATE" ] && grep -q '|run|' "$STATE" 2>/dev/null; then
                lock
                refresh
                unlock
              fi
            done
          }

          main() {
            case "${1:-}" in
              begin) cmd_begin "${2:-}" ;;
              end) cmd_end "${2:-}" "${3:-success}" ;;
              phase) cmd_phase "${2:-}" ;;
              warn) cmd_warn "${2:-}" ;;
              verdict) cmd_verdict "${2:-}" "${3:-}" "${4:-}" ;;
              finalize) cmd_finalize "${2:-}" ;;
              uploadlog) cmd_uploadlog "${2:-}" ;;
              tick) cmd_tick ;;
              ticker) cmd_ticker ;;
              *) printf 'usage: tgnotify.sh begin|end|phase|warn|verdict|finalize|uploadlog|tick|ticker\n' >&2 ;;
            esac
            exit 0
          }

          main "$@"
          TGEOF
          chmod +x /tmp/tgnotify.sh
          printf "TG_START_TIME='%s'\nTG_RUN_URL='%s'\nLUNCH_TARGET='%s'\nFOX_BRANCH='%s'\nTG_START_EPOCH='%s'\n" \
            "$(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M:%S WIB')" \
            "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "${{ env.LUNCH_TARGET }}" "${{ env.FOX_BRANCH }}" "$(date +%s)" > /tmp/tg_meta.env
          bash /tmp/tgnotify.sh phase "Build started - setting the environment" || true
          bash /tmp/tgnotify.sh begin "Set up job" || true

      - name: Notify Set up job (done)
        if: ${{ always() && !cancelled() && steps.setup.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Set up job" "${{ steps.setup.outcome }}" || true

      # =====================================================================
      # Disk space: fox_12.1 needs ~45GB, the GitHub runner only has ~20GB.
      # Two clean-up actions are used, like the reference workflow.
      # =====================================================================
      - name: Notify Free Disk Space 1
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Free Disk Space 1" || true

      - name: Free Disk Space 1
        id: free1
        uses: insightsengineering/disk-space-reclaimer@v1
        with:
          tools-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
          docker-images: true

      - name: Notify Free Disk Space 1 (done)
        if: ${{ always() && !cancelled() && steps.free1.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Free Disk Space 1" "${{ steps.free1.outcome }}" || true

      - name: Notify Free Disk Space 2
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Free Disk Space 2" || true

      - name: Free Disk Space 2
        id: free2
        uses: endersonmenezes/free-disk-space@v3
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rm"
          rmz_version: "3.1.1"
          testing: false

      - name: Notify Free Disk Space 2 (done)
        if: ${{ always() && !cancelled() && steps.free2.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Free Disk Space 2" "${{ steps.free2.outcome }}" || true

      - name: Notify Check Disk Space
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Check Disk Space" || true

      - name: Check Disk Space
        id: df1
        run: df -h

      - name: Notify Check Disk Space (done)
        if: ${{ always() && !cancelled() && steps.df1.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Check Disk Space" "${{ steps.df1.outcome }}" || true

      - name: Notify Set Swap Space
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Set Swap Space" || true

      - name: Set Swap Space
        id: swap
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 2

      - name: Notify Set Swap Space (done)
        if: ${{ always() && !cancelled() && steps.swap.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Set Swap Space" "${{ steps.swap.outcome }}" || true

      # =====================================================================
      # CHECKOUT THIS REPO - this is the device tree used by the build.
      # The result is in ${{ github.workspace }}/device_tree, then copied
      # to device/xiaomi/Mi8953 in the "Place Device Tree" step.
      # =====================================================================
      - name: Notify Checkout Device Tree
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Checkout Device Tree" || true

      - name: Checkout Device Tree
        id: checkout
        uses: actions/checkout@v4
        with:
          path: device_tree

      - name: Notify Checkout Device Tree (done)
        if: ${{ always() && !cancelled() && steps.checkout.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Checkout Device Tree" "${{ steps.checkout.outcome }}" || true

      - name: Notify Show Device Tree Revision
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Show Device Tree Revision" || true

      - name: Show Device Tree Revision
        id: dtrev
        run: |
          echo "== Device tree from this repo =="
          git -C "${{ env.DT_PATH }}" log -1 --format='%h %s (%an, %ad)' --date=short || true
          git -C "${{ env.DT_PATH }}" remote -v || true
          echo "== Lunch target to be used: ${{ env.LUNCH_TARGET }} =="

      - name: Notify Show Device Tree Revision (done)
        if: ${{ always() && !cancelled() && steps.dtrev.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Show Device Tree Revision" "${{ steps.dtrev.outcome }}" || true

      # =====================================================================
      # Dependency: jq (query API Magisk) + aria2 (download), selain paket
      # build Android standar.
      # =====================================================================
      - name: Notify Telegram - Build Started
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh phase "Build started - install dependencies" || true
          bash /tmp/tgnotify.sh begin "Install Packages" || true

      - name: Install Packages
        id: install
        run: |
          sudo apt-get update -y 2>&1 | tee -a /tmp/full_build.log
          sudo apt-get install -y --no-install-recommends \
            git curl wget zip unzip cpio bzip2 zstd lzop rsync patch file \
            make python3 bc flex bison gperf gawk \
            libxml2-utils xsltproc libssl-dev \
            build-essential ccache jq aria2 2>&1 | tee -a /tmp/full_build.log

      - name: Notify Install Packages (done)
        if: ${{ always() && !cancelled() && steps.install.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Install Packages" "${{ steps.install.outcome }}" || true

      - name: Notify Setup Repo Tool
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Setup Repo Tool" || true

      - name: Setup Repo Tool
        id: repotool
        run: |
          git config --global user.name "ofox-ci"
          git config --global user.email "build@ofox.local"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -o ~/bin/repo https://storage.googleapis.com/git-repo-downloads/repo
          chmod a+x ~/bin/repo
          echo "$HOME/bin" >> $GITHUB_PATH

      - name: Notify Setup Repo Tool (done)
        if: ${{ always() && !cancelled() && steps.repotool.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Setup Repo Tool" "${{ steps.repotool.outcome }}" || true

      - name: Notify Telegram - Syncing Source
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh phase "Syncing OrangeFox source." || true
          bash /tmp/tgnotify.sh begin "Sync OrangeFox Source" || true

      # =====================================================================
      # SYNC OrangeFox SOURCE using its official script (OrangeFox/sync).
      # This script: repo init of the TWRP minimal-manifest (twrp-12.1) ->
      # patch build system -> clone OrangeFox bootable/Recovery & vendor/recovery.
      # The device tree is NOT touched here (see the next step).
      # SYNC_BRANCH is derived from FOX_BRANCH (fox_12.1 -> 12.1).
      # =====================================================================
      - name: Sync OrangeFox Source (orangefox_sync.sh)
        id: sync
        run: |
          set -e
          mkdir -p "${{ env.SYNC_PATH }}"
          cd "$HOME"

          git clone --depth=1 "${{ env.FOX_SYNC_REPO }}" ofox-sync-tool
          cd ofox-sync-tool

          SYNC_BRANCH=$(echo "${{ env.FOX_BRANCH }}" | cut -d_ -f2)
          echo "SYNC_BRANCH=$SYNC_BRANCH" | tee -a "$GITHUB_ENV"

          bash orangefox_sync.sh --branch "$SYNC_BRANCH" --path "${{ env.SYNC_PATH }}" 2>&1 | tee -a /tmp/full_build.log

      - name: Notify Sync OrangeFox Source (done)
        if: ${{ always() && !cancelled() && steps.sync.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Sync OrangeFox Source" "${{ steps.sync.outcome }}" || true

      - name: Notify Check Disk Space
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Check Disk Space" || true

      - name: Check Disk Space (after sync)
        id: df2
        run: df -h

      - name: Notify Check Disk Space (done)
        if: ${{ always() && !cancelled() && steps.df2.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Check Disk Space" "${{ steps.df2.outcome }}" || true

      # =====================================================================
      # PLACE THE DEVICE TREE FROM THIS REPO into device/xiaomi/Mi8953.
      # This replaces the "clone device tree" step of the reference workflow:
      # its content is purely the checkout of this repo (BoardConfig.mk,
      # recovery/root, prebuilt kernel, vendorsetup.sh, etc).
      # =====================================================================
      - name: Notify Place Device Tree
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Place Device Tree" || true

      - name: Place Device Tree
        id: place
        run: |
          set -e
          DEST="${{ env.SYNC_PATH }}/${{ env.DT_DEST }}"
          echo "== Copying device tree from this repo checkout -> $DEST =="
          rm -rf "$DEST"
          mkdir -p "$DEST"
          rsync -a --exclude='.git' --exclude='.github' "${{ env.DT_PATH }}/" "$DEST/"

          echo "== Verification =="
          test -f "$DEST/BoardConfig.mk" || { echo "BoardConfig.mk is missing"; exit 1; }
          test -f "$DEST/ofox_Mi8953.mk" || { echo "ofox_Mi8953.mk is missing"; exit 1; }
          test -f "$DEST/vendorsetup.sh" || { echo "vendorsetup.sh is missing"; exit 1; }
          test -f "$DEST/prebuilt/Image.gz-dtb" || { echo "prebuilt kernel is missing"; exit 1; }

          echo "-- PRODUCT_MAKEFILES --"
          grep -A1 PRODUCT_MAKEFILES "$DEST/AndroidProducts.mk"
          echo "-- PRODUCT_NAME --"
          grep -n "^PRODUCT_NAME" "$DEST/ofox_Mi8953.mk"
          echo "-- Isi direktori --"
          ls -la "$DEST"

      - name: Notify Place Device Tree (done)
        if: ${{ always() && !cancelled() && steps.place.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Place Device Tree" "${{ steps.place.outcome }}" || true

      # =====================================================================
      # Latest Magisk - exactly the reference workflow logic: query the GitHub
      # API for the latest release, download the .apk, rename it to .zip (the
      # Magisk .apk is also a zip file), used via FOX_USE_SPECIFIC_MAGISK_ZIP
      # during the build.
      # =====================================================================
      - name: Notify Download Latest Magisk
        if: ${{ inputs.use_latest_magisk }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Download Latest Magisk" || true

      - name: Download Latest Magisk
        id: magisk
        if: ${{ inputs.use_latest_magisk }}
        run: |
          set -e
          mkdir -p "$HOME/Magisk"
          cd "$HOME/Magisk"
          echo "== Looking up the latest Magisk release URL =="
          # "|| true" at the end of the pipeline: the CI shell uses pipefail, and
          # "jq | head -1" can hit SIGPIPE even when the result is valid
          LATEST_MAGISK_URL="$(curl -sL https://api.github.com/repos/topjohnwu/Magisk/releases/latest | jq -r '.assets[] | select(.name | test("Magisk-v.*\\.apk$")) | .browser_download_url' | head -1 || true)"
          if [ -z "$LATEST_MAGISK_URL" ] || [ "$LATEST_MAGISK_URL" = "null" ]; then
            echo "Failed to find the latest Magisk release, continuing without custom Magisk"
            exit 0
          fi
          echo "URL: $LATEST_MAGISK_URL"
          aria2c "$LATEST_MAGISK_URL" || wget "$LATEST_MAGISK_URL"
          for f in Magisk*.apk; do
            [ -e "$f" ] || continue
            mv "$f" "${f%.apk}.zip"
          done
          ls -la "$HOME/Magisk"
          MAGISK_ZIP=$(ls "$HOME/Magisk"/Magisk*.zip 2>/dev/null | head -1 || true)
          if [ -n "$MAGISK_ZIP" ]; then
            echo "MAGISK_ZIP=$MAGISK_ZIP" >> "$GITHUB_ENV"
          fi

      - name: Notify Download Latest Magisk (done)
        if: ${{ always() && !cancelled() && steps.magisk.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Download Latest Magisk" "${{ steps.magisk.outcome }}" || true

      - name: Notify Check Disk Space
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Check Disk Space" || true

      - name: Check Disk Space
        id: df3
        run: df -h

      - name: Notify Check Disk Space (done)
        if: ${{ always() && !cancelled() && steps.df3.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Check Disk Space" "${{ steps.df3.outcome }}" || true

      - name: Notify Telegram - Compiling
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh phase "Compiling OrangeFox..." || true
          bash /tmp/tgnotify.sh begin "Start Disk Monitor" || true

      - name: Start Disk Monitor
        id: dmon
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          (
            ALERTED=false
            while true; do
              echo "=== $(TZ=Asia/Jakarta date +%H:%M:%S) WIB ===" >> /tmp/disk_monitor.log
              df -h >> /tmp/disk_monitor.log
              echo "" >> /tmp/disk_monitor.log

              USAGE=$(df / | tail -1 | awk '{print $5}' | tr -d '%')
              AVAIL=$(df -h / | tail -1 | awk '{print $4}')

              if [ "$USAGE" -ge 85 ] && [ "$ALERTED" = false ]; then
                ALERTED=true
                bash /tmp/tgnotify.sh warn "Disk critical: ${USAGE}% used (${AVAIL} left) - build may fail" || true
              fi

              sleep 120
            done
          ) &
          echo "DISK_MONITOR_PID=$!" >> $GITHUB_ENV

      - name: Notify Start Disk Monitor (done)
        if: ${{ always() && !cancelled() && steps.dmon.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Start Disk Monitor" "${{ steps.dmon.outcome }}" || true

      - name: Notify Start Build
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh phase "Compiling" || true
          bash /tmp/tgnotify.sh begin "Start Build" || true

      # =====================================================================
      # BUILD - follows the official OrangeFox build.sh flow:
      #   source envsetup.sh -> lunch -> mka <target>
      # OrangeFox vars are exported DIRECTLY here (before envsetup) as a
      # guarantee, because the vendorsetup.sh guard (BASH_SOURCE/BASH_ARGV)
      # is not always triggered in the CI environment. The values are the
      # same as in vendorsetup.sh of this repo's device tree.
      #
      # lunch uses the product defined by this repo: ofox_Mi8953-eng
      # (orangefox.mk trims the prefix for FOX_DEVICE_MODEL, and the
      #  OrangeFox script uses `cut -d_ -f2` -> still gets "Mi8953", so
      #  the output names & installer checks stay: ...-Mi8953.img/.zip)
      #
      # The build runs in the background so this step can edit the Telegram
      # message every 1 second -> compile duration runs in REALTIME.
      # =====================================================================
      - name: Start Build
        id: build
        working-directory: ${{ env.SYNC_PATH }}
        env:
          KBUILD_BUILD_USER: "ofox"
          KBUILD_BUILD_HOST: "ci"
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh tick || true

          mkdir -p logs
          set -o pipefail

          run_build() {
            export ALLOW_MISSING_DEPENDENCIES=true
            export FOX_USE_TWRP_RECOVERY_IMAGE_BUILDER=1
            export LC_ALL=C

            # Official Building Tip I: export FOX_BUILD_DEVICE before building
            export FOX_BUILD_DEVICE="${{ env.DEVICE }}"

            # Build identity
            export OF_MAINTAINER="${{ inputs.maintainer }}"
            export FOX_BUILD_TYPE="${{ env.OF_BUILD_TYPE }}"

            # Explicit fallback (do not rely only on the vendorsetup.sh guard)
            export OF_PATCH_AVB20=1
            export FOX_RECOVERY_SYSTEM_PARTITION="/dev/block/mapper/system"
            export FOX_RECOVERY_VENDOR_PARTITION="/dev/block/mapper/vendor"
            export OF_ENABLE_ALL_PARTITION_TOOLS=1
            export OF_FORCE_PREBUILT_KERNEL=1
            # The installer zip must pass the device check on vince/mido/ysl
            export TARGET_DEVICE_ALT="mi8953,vince,mido,ysl"
            export FOX_TARGET_DEVICES="Mi8953,mi8953,vince,mido,ysl"

            if [ -n "${MAGISK_ZIP:-}" ]; then
              export FOX_USE_SPECIFIC_MAGISK_ZIP="$MAGISK_ZIP"
            fi

            echo "== Build vars =="
            echo "OF_MAINTAINER=$OF_MAINTAINER"
            echo "FOX_BUILD_TYPE=$FOX_BUILD_TYPE"
            echo "FOX_BUILD_DEVICE=$FOX_BUILD_DEVICE"
            echo "MAGISK_ZIP=${MAGISK_ZIP:-<default>}"

            set +e
            . build/envsetup.sh
            set -e

            if ! type lunch &>/dev/null; then
              echo "❌ lunch not found - envsetup failed" | tee -a /tmp/full_build.log
              exit 1
            fi

            if ! lunch "${{ env.LUNCH_TARGET }}"; then
              echo "❌ lunch ${{ env.LUNCH_TARGET }} failed" | tee -a /tmp/full_build.log
              exit 1
            fi

            echo "TARGET_PRODUCT=$TARGET_PRODUCT" | tee -a /tmp/full_build.log
            echo "TARGET_DEVICE=$TARGET_DEVICE" | tee -a /tmp/full_build.log

            if [ "$TARGET_PRODUCT" != "${{ env.EXPECTED_PRODUCT }}" ]; then
              echo "❌ Wrong TARGET_PRODUCT: $TARGET_PRODUCT (expected ${{ env.EXPECTED_PRODUCT }})" | tee -a /tmp/full_build.log
              exit 1
            fi

            echo "== Fox env saved at /tmp/$TARGET_DEVICE/fox_env.sh =="
            ls -la "/tmp/$TARGET_DEVICE/fox_env.sh" 2>/dev/null || true

            mka -j$(nproc --all) "${{ inputs.target }}" 2>&1 | tee logs/build.txt | tee -a /tmp/full_build.log
          }

          run_build &
          BUILD_PID=$!

          # real-time: update the Telegram message every 1 second while compiling
          while kill -0 "$BUILD_PID" 2>/dev/null; do
            bash /tmp/tgnotify.sh tick || true
            sleep 1
          done

          set +e
          wait "$BUILD_PID"
          BUILD_RC=$?
          set -e

          if [ "$BUILD_RC" -ne 0 ]; then
            echo "❌ Build failed (exit code $BUILD_RC)" | tee -a /tmp/full_build.log
            exit "$BUILD_RC"
          fi
          echo "✅ Build finished"

      - name: Notify Start Build (with log) (done)
        if: ${{ always() && !cancelled() && steps.build.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Start Build" "${{ steps.build.outcome }}" || true

      - name: Notify Stop Disk Monitor & Save Log
        if: ${{ always() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh phase "Packing" || true
          bash /tmp/tgnotify.sh begin "Stop Disk Monitor & Save Log" || true

      - name: Stop Disk Monitor & Save Log
        id: dmonstop
        if: always()
        run: |
          kill "$DISK_MONITOR_PID" 2>/dev/null || true
          echo "=== FINAL $(TZ=Asia/Jakarta date +%H:%M:%S) WIB ===" >> /tmp/disk_monitor.log
          df -h >> /tmp/disk_monitor.log
          mkdir -p "${{ env.SYNC_PATH }}/debug-info"
          cp /tmp/disk_monitor.log "${{ env.SYNC_PATH }}/debug-info/disk_monitor.log" 2>/dev/null || true

      - name: Notify Stop Disk Monitor & Save Log (done)
        if: ${{ always() && !cancelled() && steps.dmonstop.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Stop Disk Monitor & Save Log" "${{ steps.dmonstop.outcome }}" || true

      - name: Notify Check Disk Space
        if: ${{ always() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Check Disk Space" || true

      - name: Check Disk Space
        id: df4
        if: always()
        run: df -h

      - name: Notify Check Disk Space (done)
        if: ${{ always() && !cancelled() && steps.df4.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Check Disk Space" "${{ steps.df4.outcome }}" || true

      - name: Notify Upload Build Log
        if: ${{ always() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Upload Build Log" || true

      - name: Upload Build Log
        id: uplog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofox-mi8953-build-log
          path: ${{ env.SYNC_PATH }}/logs/build.txt
          if-no-files-found: warn

      - name: Notify Upload Build Log (done)
        if: ${{ always() && !cancelled() && steps.uplog.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Upload Build Log" "${{ steps.uplog.outcome }}" || true

      - name: Notify Collect Debug Info
        if: ${{ always() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Collect Debug Info" || true

      - name: Collect Debug Info
        id: dbg1
        if: always()
        working-directory: ${{ env.SYNC_PATH }}
        run: |
          mkdir -p debug-info
          OUT=out/target/product/${{ env.DEVICE }}/recovery/root/system/etc
          cp -v "$OUT/twrp.flags" debug-info/twrp.flags.final 2>/dev/null || echo "twrp.flags.final: not found" > debug-info/twrp.flags.final
          cp -v "$OUT/recovery.fstab" debug-info/recovery.fstab.final 2>/dev/null || echo "recovery.fstab.final: not found" > debug-info/recovery.fstab.final
          cp -v "device/${{ env.DT_DEST }}/BoardConfig.mk" debug-info/BoardConfig.mk.used 2>/dev/null || true
          cp -v "device/${{ env.DT_DEST }}/vendorsetup.sh" debug-info/vendorsetup.sh.used 2>/dev/null || true
          {
            echo "Built at: $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M:%S WIB')"
            echo "TARGET_PRODUCT=ofox_${{ env.DEVICE }}"
            echo "FOX_BRANCH=${{ env.FOX_BRANCH }}"
            echo "DT_REVISION=$(git -C "${{ env.DT_PATH }}" rev-parse --short HEAD 2>/dev/null || echo n/a)"
          } > debug-info/build-meta.txt

      - name: Notify Collect Debug Info (done)
        if: ${{ always() && !cancelled() && steps.dbg1.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Collect Debug Info" "${{ steps.dbg1.outcome }}" || true

      - name: Notify Upload Debug Info
        if: ${{ always() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Upload Debug Info" || true

      - name: Upload Debug Info
        id: dbg2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ofox-mi8953-debug-info
          path: ${{ env.SYNC_PATH }}/debug-info
          if-no-files-found: warn

      - name: Notify Upload Debug Info (done)
        if: ${{ always() && !cancelled() && steps.dbg2.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Upload Debug Info" "${{ steps.dbg2.outcome }}" || true

      - name: Notify Upload recovery.img
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Upload recovery.img" || true

      - name: Upload recovery.img
        id: upimg
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ofox-mi8953-recovery
          path: ${{ env.SYNC_PATH }}/out/target/product/${{ env.DEVICE }}/recovery.img

      - name: Notify Upload recovery.img (done)
        if: ${{ always() && !cancelled() && steps.upimg.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Upload recovery.img" "${{ steps.upimg.outcome }}" || true

      - name: Notify Upload OrangeFox image
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Upload OrangeFox image" || true

      - name: Upload OrangeFox image
        id: upofx1
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ofox-mi8953-ofox-img
          path: ${{ env.SYNC_PATH }}/out/target/product/${{ env.DEVICE }}/OrangeFox*.img
          if-no-files-found: warn

      - name: Notify Upload OrangeFox image (done)
        if: ${{ always() && !cancelled() && steps.upofx1.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Upload OrangeFox image" "${{ steps.upofx1.outcome }}" || true

      - name: Notify Upload OrangeFox zip
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Upload OrangeFox zip" || true

      - name: Upload OrangeFox zip
        id: upofx2
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ofox-mi8953-zip
          path: ${{ env.SYNC_PATH }}/out/target/product/${{ env.DEVICE }}/OrangeFox*.zip
          if-no-files-found: warn

      - name: Notify Upload OrangeFox zip (done)
        if: ${{ always() && !cancelled() && steps.upofx2.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Upload OrangeFox zip" "${{ steps.upofx2.outcome }}" || true

      - name: Notify Telegram - Build Success (start)
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh phase "Build succeeded" || true
          bash /tmp/tgnotify.sh begin "Done" || true

      - name: Notify Telegram - Build Success
        id: bsuccess
        if: success()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          IMG_SIZE=$(du -sh "${{ env.SYNC_PATH }}/out/target/product/${{ env.DEVICE }}/recovery.img" 2>/dev/null | cut -f1 || true)
          DISK_FINAL=$(df -h / | tail -1 | awk '{print "used "$5" ("$4" left)"}')
          bash /tmp/tgnotify.sh verdict success "${IMG_SIZE:-N/A}" "$DISK_FINAL" || true

      - name: Notify Telegram - Build Success (done)
        if: ${{ always() && !cancelled() && steps.bsuccess.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Done" "${{ steps.bsuccess.outcome }}" || true

      # =====================================================================
      # FAILURE HANDLERS - all still in the same Telegram message.
      # =====================================================================
      - name: Notify Send Disk Monitor Log to Telegram on Failure
        if: ${{ failure() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Send Disk Monitor Log to Telegram on Failure" || true

      - name: Send Disk Monitor Log to Telegram on Failure
        id: dmfail
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then exit 0; fi
          if [ -f /tmp/disk_monitor.log ]; then
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document=@/tmp/disk_monitor.log \
              -F caption="💾 Disk usage log every 2 minutes during the build (OrangeFox Mi8953, FAILED)"
          fi

      - name: Notify Send Disk Monitor Log to Telegram on Failure (done)
        if: ${{ always() && !cancelled() && steps.dmfail.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Send Disk Monitor Log to Telegram on Failure" "${{ steps.dmfail.outcome }}" || true

      - name: Notify Upload Full Log to Telegram on Failure
        if: ${{ failure() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh begin "Upload Full Log to Telegram on Failure" || true

      - name: Upload Full Log to Telegram on Failure
        id: fullfail
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          if [ -z "${TG_BOT_TOKEN:-}" ] || [ -z "${TG_CHAT_ID:-}" ]; then exit 0; fi
          if [ -f /tmp/tg_log_uploaded ]; then
            echo "Build log was already sent right when the step failed - skipping duplicate."
            exit 0
          fi
          mkdir -p "${{ env.SYNC_PATH }}/logs"
          cat /tmp/full_build.log >> "${{ env.SYNC_PATH }}/logs/build.txt" 2>/dev/null || true

          LOG_FILE="${{ env.SYNC_PATH }}/logs/build.txt"
          [ -f "$LOG_FILE" ] || LOG_FILE="/tmp/full_build.log"
          [ -f "$LOG_FILE" ] || exit 0

          FILE_SIZE=$(du -m "$LOG_FILE" 2>/dev/null | cut -f1 || true)
          [ -n "$FILE_SIZE" ] || FILE_SIZE=0
          if [ "$FILE_SIZE" -gt 45 ]; then
            gzip -kf "$LOG_FILE"
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document=@"${LOG_FILE}.gz" \
              -F caption="📄 Full build log (compressed) - OrangeFox Mi8953 (FAILED)"
          else
            curl -s -X POST "https://api.telegram.org/bot${TG_BOT_TOKEN}/sendDocument" \
              -F chat_id="${TG_CHAT_ID}" \
              -F document=@"${LOG_FILE}" \
              -F caption="📄 Full build log - OrangeFox Mi8953 (FAILED)"
          fi

      - name: Notify Upload Full Log to Telegram on Failure (done)
        if: ${{ always() && !cancelled() && steps.fullfail.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Upload Full Log to Telegram on Failure" "${{ steps.fullfail.outcome }}" || true

      - name: Notify Telegram - Build Failed (start)
        if: ${{ failure() && !cancelled() }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          bash /tmp/tgnotify.sh phase "Build Failed" || true
          bash /tmp/tgnotify.sh begin "Failed" || true

      - name: Notify Telegram - Build Failed
        id: bfailed
        if: failure()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: |
          DISK_FINAL=$(df -h / | tail -1 | awk '{print "used "$5" ("$4" left)"}' 2>/dev/null || echo "N/A")
          bash /tmp/tgnotify.sh verdict failure "N/A" "$DISK_FINAL" || true

      - name: Notify Telegram - Build Failed (done)
        if: ${{ always() && !cancelled() && steps.bfailed.outcome != 'skipped' }}
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh end "Notify Telegram - Build Failed" "${{ steps.bfailed.outcome }}" || true

      # =====================================================================
      # FINALIZE: stop the ticker, close any unfinished lines,
      # send the last verdict (if not sent yet) -> final Telegram message.
      # =====================================================================
      - name: Finalize Telegram Status
        if: always()
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: bash /tmp/tgnotify.sh finalize "${{ job.status }}" || true

